<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #e8385a;
    --rose-light: #ff6b8a;
    --rose-dark: #c02540;
    --blush: #fff0f3;
    --cream: #fffaf9;
    --text: #2d1a22;
    --muted: #9c7080;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Lato', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }

  .bg-petals {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .petal {
    position: absolute;
    font-size: 22px;
    opacity: 0;
    animation: petalFall linear infinite;
  }
  @keyframes petalFall {
    0%   { opacity: 0; transform: translateY(-40px) rotate(0deg); }
    10%  { opacity: 0.7; }
    90%  { opacity: 0.5; }
    100% { opacity: 0; transform: translateY(110vh) rotate(360deg); }
  }

  .floaty-heart {
    position: fixed;
    font-size: 28px;
    pointer-events: none;
    z-index: 999;
    animation: floatUp 2.4s ease forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-200px) scale(0.4); }
  }

  .card {
    position: relative;
    z-index: 1;
    background: white;
    border-radius: 32px;
    padding: 52px 48px 48px;
    max-width: 540px;
    width: 92vw;
    box-shadow: 0 8px 60px rgba(232,56,90,0.12), 0 2px 12px rgba(0,0,0,0.06);
    text-align: center;
    animation: cardIn 0.9s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .bear-wrap {
    margin-bottom: 12px;
    position: relative;
    display: inline-block;
  }
  .bear-wrap .bear-main {
    font-size: 90px;
    display: block;
    animation: bearBounce 2.4s ease-in-out infinite;
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s;
    filter: drop-shadow(0 6px 18px rgba(232,56,90,0.18));
  }
  .bear-wrap .bear-main:active { transform: scale(0.88); }

  @keyframes bearBounce {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-14px) rotate(2deg); }
  }

  .speech {
    position: absolute;
    top: -12px;
    right: -60px;
    background: var(--rose);
    color: white;
    font-family: 'Lato', sans-serif;
    font-size: 12px;
    font-weight: 400;
    padding: 5px 10px;
    border-radius: 12px;
    white-space: nowrap;
    opacity: 0;
    transform: scale(0.7) translateY(6px);
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none;
  }
  .speech::before {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 14px;
    border: 6px solid transparent;
    border-top-color: var(--rose);
    border-bottom: none;
  }
  .bear-wrap:hover .speech {
    opacity: 1;
    transform: scale(1) translateY(0);
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    font-weight: 400;
    color: var(--rose);
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 14px;
    color: var(--muted);
    font-weight: 300;
    letter-spacing: 0.5px;
    margin-bottom: 28px;
  }

  .progress-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
    min-height: 12px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #f0dde2;
    transition: background 0.4s, transform 0.4s;
  }
  .dot.active {
    background: var(--rose);
    transform: scale(1.35);
  }
  .dot.done {
    background: var(--rose-light);
  }

  #sorryText {
    display: none;
    margin-bottom: 28px;
  }
  .line {
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.7s ease, transform 0.7s ease;
    font-size: 16px;
    line-height: 2;
    font-weight: 300;
    color: var(--text);
    padding: 2px 0;
  }
  .line.show {
    opacity: 1;
    transform: translateY(0);
  }
  .line.highlight {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--rose);
    font-weight: 400;
  }

  .bear-parade {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 18px;
    font-size: 38px;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .bear-parade.show { opacity: 1; }
  .parade-bear {
    display: inline-block;
    animation: paradeWave 1.4s ease-in-out infinite;
  }
  .parade-bear:nth-child(2) { animation-delay: 0.2s; }
  .parade-bear:nth-child(3) { animation-delay: 0.4s; }
  .parade-bear:nth-child(4) { animation-delay: 0.6s; }
  @keyframes paradeWave {
    0%,100% { transform: translateY(0) rotate(-8deg) scale(1); }
    50%      { transform: translateY(-10px) rotate(8deg) scale(1.1); }
  }

  .btn-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    padding: 13px 26px;
    font-size: 15px;
    font-family: 'Lato', sans-serif;
    font-weight: 400;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: background 0.22s, transform 0.15s, box-shadow 0.2s;
    letter-spacing: 0.2px;
  }
  .btn:active { transform: scale(0.95); }

  .btn-primary {
    background: var(--rose);
    color: white;
    box-shadow: 0 4px 18px rgba(232,56,90,0.32);
  }
  .btn-primary:hover {
    background: var(--rose-dark);
    box-shadow: 0 6px 22px rgba(232,56,90,0.42);
  }

  .btn-secondary {
    background: var(--blush);
    color: var(--rose);
    border: 1.5px solid #f8c8d3;
  }
  .btn-secondary:hover {
    background: #fde0e7;
  }

  #forgivenScreen {
    display: none;
    animation: fadeInScale 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes fadeInScale {
    from { opacity: 0; transform: scale(0.85); }
    to   { opacity: 1; transform: scale(1); }
  }
  .forgiven-emoji { font-size: 72px; margin-bottom: 12px; display: block; animation: bearBounce 2s infinite; }
  .forgiven-title {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--rose);
    margin-bottom: 8px;
  }
  .forgiven-sub {
    font-size: 15px;
    font-weight: 300;
    color: var(--muted);
    line-height: 1.8;
  }

  #confettiCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 9999;
  }

  .tap-hint {
    font-size: 11px;
    color: #d4aab5;
    margin-top: 6px;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>

<div class="bg-petals" id="petals"></div>
<canvas id="confettiCanvas"></canvas>

<div class="card" id="mainCard">

  <div id="defaultView">
    <div class="bear-wrap">
      <span class="bear-main" id="mainBear" onclick="bearTap()" title="tap me!">🥺</span>
      <div class="speech">Tap me! 🥺</div>
    </div>
    <p class="tap-hint">tap me ↑</p>

    <h1>I'm So Sorry</h1>
    <p class="subtitle">Please mujhy maaf krdo maalkin</p>

    <div class="progress-dots" id="progressDots"></div>

    <div id="sorryText"></div>

    <div class="bear-parade" id="bearParade">
      <span class="parade-bear">🥺</span>
      <span class="parade-bear">🥺</span>
      <span class="parade-bear">🥺</span>
      <span class="parade-bear">🥺</span>
    </div>

    <div class="btn-row" id="btnRow">
      <button class="btn btn-primary" onclick="showNext()" id="mainBtn">Read My Apology 💌</button>
    </div>
  </div>

  <div id="forgivenScreen">
    <span class="forgiven-emoji">🥰</span>
    <div class="forgiven-title">Thank You ❤️</div>
    <div class="forgiven-sub">You have no idea how much this means.<br>I promise I'll make it up to you.</div>
    <div class="btn-row" style="margin-top:24px">
      <button class="btn btn-secondary" onclick="restart()">← Start Over</button>
    </div>
  </div>

</div>

<script>
const messages = [
  { text: "I know mein nai glti ki.", highlight: false },
  { text: "Just know ke mujhy kabhi bhi koi aur psnd nae askti.", highlight: false },
  { text: "Hamesha aap hi psnd rahogi.", highlight: false },
  { text: "Apko payar nae kra uskelie bhi sorry.", highlight: true },
  { text: "You mean more to me than I know how to say.", highlight: false },
  { text: "I never want to hurt you.", highlight: false },
  { text: "I promise I will do better.", highlight: false },
  { text: "Please forgive me mujhy maaf krdo baby, I love you❤️", highlight: true },
];

let currentLine = 0;
let revealed = false;

function buildDots() {
  const wrap = document.getElementById('progressDots');
  wrap.innerHTML = '';
  messages.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    wrap.appendChild(d);
  });
}

function buildLines() {
  const box = document.getElementById('sorryText');
  box.innerHTML = '';
  messages.forEach((msg, i) => {
    const d = document.createElement('div');
    d.className = 'line' + (msg.highlight ? ' highlight' : '');
    d.id = `line-${i}`;
    d.textContent = msg.text;
    box.appendChild(d);
  });
}

function showNext() {
  if (!revealed) {
    document.getElementById('sorryText').style.display = 'block';
    revealed = true;
    buildDots();
    buildLines();
    revealLine(0);
    updateBtn();
    return;
  }
  if (currentLine < messages.length - 1) {
    currentLine++;
    revealLine(currentLine);
    updateBtn();
  } else {
    showForgiveOptions();
  }
}

function revealLine(index) {
  const line = document.getElementById(`line-${index}`);
  if (line) setTimeout(() => line.classList.add('show'), 80);

  for (let i = 0; i < messages.length; i++) {
    const dot = document.getElementById(`dot-${i}`);
    if (!dot) continue;
    dot.classList.remove('active', 'done');
    if (i < index) dot.classList.add('done');
    else if (i === index) dot.classList.add('active');
  }

  if (index === messages.length - 1) {
    setTimeout(() => {
      document.getElementById('bearParade').classList.add('show');
    }, 700);
  }
}

function updateBtn() {
  const btn = document.getElementById('mainBtn');
  if (!btn) return;
  if (!revealed) { btn.textContent = 'Read My Apology 💌'; return; }
  const remaining = messages.length - 1 - currentLine;
  btn.textContent = remaining > 0 ? `Next (${remaining} left) →` : 'Done ✓';
}

function showForgiveOptions() {
  document.getElementById('btnRow').innerHTML = `
    <button class="btn btn-primary" onclick="forgiven()">I Forgive You 💖</button>
    <button class="btn btn-secondary" onclick="notYet()">Not Yet... 😔</button>
  `;
}

function forgiven() {
  spawnHearts();
  launchConfetti();
  setTimeout(() => {
    document.getElementById('defaultView').style.display = 'none';
    document.getElementById('forgivenScreen').style.display = 'block';
  }, 400);
}

function notYet() {
  const bear = document.getElementById('mainBear');
  bear.style.animation = 'none';
  bear.textContent = '😢';
  setTimeout(() => {
    bear.textContent = '🥺';
    bear.style.animation = '';
  }, 1800);
  setTimeout(() => {
    currentLine = 0;
    buildDots();
    buildLines();
    revealLine(0);
    document.getElementById('btnRow').innerHTML = `<button class="btn btn-primary" onclick="showNext()" id="mainBtn">Next →</button>`;
    updateBtn();
  }, 2000);
}

function restart() {
  document.getElementById('forgivenScreen').style.display = 'none';
  document.getElementById('defaultView').style.display = 'block';
  revealed = false;
  currentLine = 0;
  document.getElementById('sorryText').style.display = 'none';
  document.getElementById('bearParade').classList.remove('show');
  document.getElementById('progressDots').innerHTML = '';
  document.getElementById('btnRow').innerHTML = `<button class="btn btn-primary" onclick="showNext()" id="mainBtn">Read My Apology 💌</button>`;
}

let tapCount = 0;
const bearQuips = ['😢','💕','💌','🙏','😔','❤️','🫶'];
function bearTap() {
  tapCount++;
  const bear = document.getElementById('mainBear');
  bear.style.transform = 'scale(1.35) rotate(-8deg)';
  setTimeout(() => bear.style.transform = '', 300);
  spawnSingleHeart(bear.getBoundingClientRect());
  if (tapCount === 5) {
    bear.textContent = bearQuips[Math.floor(Math.random() * bearQuips.length)];
    setTimeout(() => bear.textContent = '🥺', 1000);
    tapCount = 0;
  }
}

function spawnSingleHeart(rect) {
  const el = document.createElement('div');
  el.className = 'floaty-heart';
  el.textContent = ['❤️','💕','💗','💓'][Math.floor(Math.random()*4)];
  el.style.left = (rect.left + rect.width/2 - 14 + (Math.random()-0.5)*40) + 'px';
  el.style.top = (rect.top + rect.height/2 - 14) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

function spawnHearts() {
  for (let i = 0; i < 18; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'floaty-heart';
      el.textContent = ['❤️','💕','💗','💓','🫶'][Math.floor(Math.random()*5)];
      el.style.left = (Math.random() * window.innerWidth) + 'px';
      el.style.top = (window.innerHeight - 60) + 'px';
      el.style.fontSize = (20 + Math.random()*20) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }, i * 90);
  }
}

function launchConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const pieces = [];
  const colors = ['#e8385a','#ff6b8a','#ffb3c1','#ff99aa','#ffd6de','#ffe0e8'];
  for (let i = 0; i < 140; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * -canvas.height,
      w: 6 + Math.random()*8,
      h: 10 + Math.random()*10,
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*360,
      rotV: (Math.random()-0.5)*6,
      vy: 2 + Math.random()*4,
      vx: (Math.random()-0.5)*2.5,
      alpha: 1
    });
  }
  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI/180);
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
      p.y += p.vy;
      p.x += p.vx;
      p.rot += p.rotV;
      if (p.y > canvas.height * 0.75) p.alpha -= 0.018;
    });
    frame++;
    if (frame < 200) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  draw();
}

function spawnPetal() {
  const petals = document.getElementById('petals');
  const el = document.createElement('div');
  el.className = 'petal';
  el.textContent = ['🌸','🌺','💮','🌷','🪷'][Math.floor(Math.random()*5)];
  el.style.left = Math.random()*100 + 'vw';
  el.style.top = '-40px';
  const dur = 7 + Math.random()*8;
  el.style.animationDuration = dur + 's';
  el.style.animationDelay = '0s';
  el.style.fontSize = (14 + Math.random()*14) + 'px';
  petals.appendChild(el);
  setTimeout(() => el.remove(), dur * 1000 + 200);
}
setInterval(spawnPetal, 900);

buildDots();
buildLines();
</script>
</body>
</html>
